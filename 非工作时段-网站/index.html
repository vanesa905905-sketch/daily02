<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="非工作时段">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon.png"><link rel="icon" href="icon.png">
<title>非工作时段</title>
<style>
:root{
  --bg:#f6f7f9; --card:#ffffff; --card2:#f1f3f7; --soft:#fbfcfd;
  --line:#e4e8ef; --line2:#cfd6e0;
  --tx:#1b2432; --tx2:#5d6b7e; --tx3:#8d99a9;
  --ac:#d97528; --ac2:#b45f18; --acbg:#fdf3e9;
  --hi:#2b6cb8; --hibg:#eaf1fa; --ok:#17916a; --okbg:#e7f6f0;
  --warn:#c4462f; --warnbg:#fbecea; --mid:#b8860b; --midbg:#fdf6e0;
  --r:14px; --sh:0 1px 2px rgba(20,30,50,.05),0 4px 14px rgba(20,30,50,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-size:15px;line-height:1.65;
 font-family:-apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
 padding-bottom:calc(74px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px}
h1,h2,h3,h4{margin:0;font-weight:660;line-height:1.35}
a{color:var(--hi);text-decoration:none}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
header{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:12px;padding:13px 0}
.hd .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(140deg,#eb9a4e,#c9631f);display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff;flex:0 0 auto}
.hd .t{font-size:16px;font-weight:680}
.hd .d{font-size:12px;color:var(--tx3);margin-top:1px}
.hd .sp{flex:1}
.badge{font-size:11px;color:var(--ac2);border:1px solid #f0d9be;background:var(--acbg);padding:4px 10px;border-radius:999px;white-space:nowrap}
nav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(255,255,255,.97);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav .in{display:flex;max-width:1000px;margin:0 auto}
nav button{flex:1;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--tx3)}
nav button .ic{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav button span{font-size:10.5px}
nav button.on{color:var(--ac)}
.view{display:none;padding-top:18px;animation:fade .25s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.card.tap{cursor:pointer;transition:transform .16s,box-shadow .16s}
.card.tap:active{transform:scale(.995)}
.eyebrow{font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:var(--tx3);font-weight:640;margin-bottom:8px}
.sec-t{font-size:13px;font-weight:660;color:var(--tx2);margin:24px 0 11px;letter-spacing:.3px;display:flex;align-items:center;gap:9px}
.sec-t::after{content:"";flex:1;height:1px;background:var(--line)}
.muted{color:var(--tx2)}.small{font-size:13.5px}.tiny{font-size:12px;color:var(--tx3)}
.chip{display:inline-block;font-size:11.5px;padding:3px 9px;border-radius:999px;background:var(--card2);color:var(--tx2);border:1px solid var(--line)}
.chip.ac{color:var(--ac2);border-color:#f0d9be;background:var(--acbg)}
.chip.ok{color:var(--ok);border-color:#bfe6d6;background:var(--okbg)}
.chip.hi{color:var(--hi);border-color:#c8dcf3;background:var(--hibg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 16px;border-radius:11px;background:var(--card);border:1px solid var(--line2);font-size:14px;font-weight:560;white-space:nowrap;transition:background .15s}
.btn svg{width:16px;height:16px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn:active{background:var(--card2)}
.btn.pri{background:linear-gradient(140deg,#e9883b,#cf6a20);color:#fff;border-color:transparent;font-weight:660}
.btn.full{width:100%}
.row{display:flex;gap:9px;flex-wrap:wrap}
.scroller{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 10px;margin:0 -16px;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.pill{flex:0 0 auto;padding:7px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13px;color:var(--tx2);white-space:nowrap}
.pill.on{background:var(--acbg);border-color:#eab98a;color:var(--ac2);font-weight:620}
.hero{background:linear-gradient(150deg,#fff6ec,#ffffff 70%);border:1px solid #f2e2d0;border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:var(--sh)}
.hero .k{font-size:12px;color:var(--ac2);letter-spacing:1.1px;text-transform:uppercase;font-weight:660}
.hero h2{font-size:23px;margin:8px 0 6px}
.hero p{margin:0;color:var(--tx2);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:16px 0 4px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 6px;text-align:center}
.stat b{display:block;font-size:20px;font-weight:720;color:var(--ac2);line-height:1.2}
.stat span{font-size:10.5px;color:var(--tx3)}
/* english */
.grp{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden;background:var(--card)}
.grp>summary{padding:13px 15px;cursor:pointer;list-style:none;display:flex;align-items:center;gap:9px;font-weight:620;font-size:14px}
.grp>summary::-webkit-details-marker{display:none}
.grp>summary::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ac);flex:0 0 auto}
.grp>summary .n{margin-left:auto;font-size:11px;color:var(--tx3);font-weight:400}
.words{padding:0 8px 8px}
.w{display:flex;align-items:center;gap:10px;padding:9px 8px;border-top:1px solid var(--line)}
.w .en{font-weight:620;font-size:14.5px}.w .zh{font-size:13px;color:var(--tx2);margin-top:1px}
.w .sp{flex:1;min-width:0}
.ib{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex:0 0 auto;border:1px solid var(--line);color:var(--tx3)}
.ib svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib.star.on{color:var(--ac);border-color:#eab98a;background:var(--acbg)}
.ib.star.on svg{fill:currentColor}
.ph{padding:12px 14px;border-top:1px solid var(--line)}
.ph:first-child{border-top:none}
.ph .en{font-weight:620;font-size:14.5px}.ph .zh{font-size:13px;color:var(--tx2);margin-top:3px}
.ph .nt{font-size:12px;color:var(--ac2);margin-top:5px}
.ph .hd2{display:flex;gap:10px;align-items:flex-start}
/* study */
.sc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:30px 22px;min-height:290px;display:flex;flex-direction:column;justify-content:center;text-align:center;box-shadow:var(--sh);margin-bottom:14px}
.sc .kind{font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:var(--tx3);font-weight:640;margin-bottom:14px}
.sc .front{font-size:27px;font-weight:700;line-height:1.35;word-break:break-word}
.sc .front.long{font-size:21px}
.sc .back{margin-top:18px;padding-top:16px;border-top:1px dashed var(--line2)}
.sc .back .zh{font-size:19px;font-weight:600}
.sc .back .nt{font-size:13px;color:var(--ac2);margin-top:8px}
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.grade button{padding:14px 6px;border-radius:12px;border:1px solid var(--line2);font-weight:620;font-size:14px;background:var(--card)}
.grade .no{color:var(--warn);border-color:#eec4bb;background:var(--warnbg)}
.grade .mid{color:var(--mid);border-color:#ecdca6;background:var(--midbg)}
.grade .yes{color:var(--ok);border-color:#bfe6d6;background:var(--okbg)}
.prog{height:5px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:7px}
.prog i{display:block;height:100%;background:var(--ac);transition:width .3s}
.bar{display:flex;height:9px;border-radius:99px;overflow:hidden;background:var(--line);margin:10px 0}
.bar i{display:block;height:100%}
.opt{display:block;width:100%;text-align:left;padding:14px 16px;border-radius:12px;background:var(--card);border:1px solid var(--line);margin-bottom:9px;font-size:15px}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--warn);background:var(--warnbg)}
.inp{width:100%;padding:13px 14px;border-radius:11px;border:1px solid var(--line2);font-size:16px;background:var(--card);color:var(--tx)}
/* map */
#mapWrap{position:relative;background:#eaf0f6;border:1px solid var(--line);border-radius:14px;overflow:hidden;touch-action:none;margin-bottom:10px}
#map{width:100%;display:block;cursor:grab}
.mctl{position:absolute;right:9px;bottom:9px;display:flex;flex-direction:column;gap:6px}
.mctl button{width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.94);border:1px solid var(--line2);font-size:18px;font-weight:600;line-height:1;display:grid;place-items:center;box-shadow:var(--sh)}
.mtip{position:absolute;left:9px;top:9px;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:9px;padding:5px 10px;font-size:12.5px;font-weight:600;pointer-events:none;opacity:0;transition:opacity .15s}
.mtip.on{opacity:1}
/* country */
.cflag{font-size:38px;line-height:1}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:9px;margin:14px 0 0}
.fact{background:var(--card2);border-radius:10px;padding:10px 12px}
.fact b{display:block;font-size:10.5px;color:var(--tx3);text-transform:uppercase;letter-spacing:.7px;font-weight:640;margin-bottom:3px}
.fact span{font-size:13.5px}
.ccards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:11px}
.ccards.tight{grid-template-columns:repeat(auto-fill,minmax(142px,1fr));gap:9px}
.cc{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--sh)}
.cc .img{height:112px;background:linear-gradient(135deg,#eef2f7,#e3e9f1);display:grid;place-items:center;overflow:hidden}
.cc .img img{width:100%;height:100%;object-fit:cover;display:block}
.cc .img .ph2{font-size:11px;color:var(--tx3);letter-spacing:.5px}
.cc .bd{padding:11px 12px}
.cc .tp{font-size:10.5px;color:var(--ac2);letter-spacing:.9px;font-weight:660;text-transform:uppercase}
.cc h4{font-size:14.5px;margin:4px 0 5px}
.cc p{margin:0;font-size:12.5px;color:var(--tx2);line-height:1.55}
.tl{position:relative;padding-left:20px}
.tl::before{content:"";position:absolute;left:5px;top:5px;bottom:5px;width:2px;background:var(--line)}
.tl .ev{position:relative;margin-bottom:15px}
.tl .ev::before{content:"";position:absolute;left:-18px;top:7px;width:9px;height:9px;border-radius:50%;background:var(--ac);border:2px solid var(--card)}
.tl .y{font-size:12px;font-weight:700;color:var(--ac2);letter-spacing:.4px}
.tl .x{font-size:13.5px;color:var(--tx2);margin-top:2px}
.adm{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:7px}
.adm div{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:7px 10px;background:var(--card2);border-radius:8px}
.adm div span:last-child{color:var(--tx3);flex:0 0 auto}
.iss{border-left:3px solid #eec4bb;padding:1px 0 1px 12px;margin-bottom:13px}
.iss h4{font-size:14.5px}.iss p{margin:3px 0 0;font-size:13.5px;color:var(--tx2)}
.spot{padding:10px 0;border-top:1px solid var(--line)}
.spot:first-child{border-top:none}
.spot b{font-size:14px}.spot p{margin:2px 0 0;font-size:13px;color:var(--tx2)}
.route{background:var(--hibg);border:1px solid #cfe0f4;border-radius:11px;padding:12px;margin-bottom:9px}
.route b{font-size:14px;color:var(--hi)}.route p{margin:4px 0 0;font-size:13px;color:var(--tx2)}
.ri{border-left:3px solid var(--line2);padding:2px 0 2px 13px;margin-bottom:18px}
.ri h4{font-size:15px;margin-bottom:6px}.ri p{margin:0 0 8px;font-size:13.5px;color:var(--tx2)}
.take{background:var(--acbg);border:1px solid #f0dcc4;border-radius:10px;padding:10px 12px;font-size:13px;color:var(--ac2);margin-bottom:8px}
.back{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--tx2);margin-bottom:14px}
.empty{text-align:center;padding:38px 20px;color:var(--tx3);font-size:14px}
.spin{width:26px;height:26px;border:2.5px solid var(--line);border-top-color:var(--ac);border-radius:50%;margin:30px auto;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media(min-width:720px){.hd{padding:17px 0}.view{padding-top:24px}.stats{gap:11px}}
</style>
</head>
<body>
<header><div class="wrap hd">
  <div class="logo">非</div>
  <div><div class="t">非工作时段</div><div class="d" id="hdDate"></div></div>
  <div class="sp"></div><div class="badge" id="hdBadge"></div>
</div></header>
<main class="wrap">
<section class="view on" id="v-today">
  <div class="hero"><div class="k">今日推送</div><h2 id="tdTitle">—</h2><p id="tdSub">—</p></div>
  <div class="stats">
    <div class="stat"><b id="stNew">0</b><span>今日新学</span></div>
    <div class="stat"><b id="stDue">0</b><span>待复习</span></div>
    <div class="stat"><b id="stKnown">0</b><span>已掌握</span></div>
    <div class="stat"><b id="stWeak">0</b><span>薄弱</span></div>
  </div>
  <div class="sec-t">今日英语单元</div><div id="tdScene"></div>
  <div class="sec-t">今日国家</div><div class="card tap" id="tdGeo"></div>
  <div class="sec-t" id="tdRetailHd">零售速览</div><div id="tdRetail"></div>
</section>
<section class="view" id="v-en"><div class="scroller" id="enPills"></div><div id="enBody"></div></section>
<section class="view" id="v-study"><div id="studyBody"></div></section>
<section class="view" id="v-geo">
  <div id="geoList">
    <div id="mapWrap"><canvas id="map"></canvas>
      <div class="mtip" id="mtip"></div>
      <div class="mctl"><button onclick="zoomBy(1.5)">+</button><button onclick="zoomBy(.667)">−</button><button onclick="resetMap()" style="font-size:13px">⟲</button></div>
    </div>
    <div class="tiny" style="text-align:center;margin-bottom:12px">拖动平移 · 双指或按钮缩放 · 点击国家查看</div>
    <div class="row" style="justify-content:center;margin-bottom:14px">
      <button class="btn" onclick="showCountry(todayCountry().id)">今日国家</button>
      <button class="btn" onclick="randomCountry()">随机</button>
    </div>
    <div class="scroller" id="contPills"></div><div id="geoGrid"></div>
  </div>
  <div id="geoDetail" style="display:none"></div>
</section>
<section class="view" id="v-retail"><div id="retailBody"></div></section>
</main>
<nav><div class="in">
  <button data-v="today" class="on"><svg class="ic" viewBox="0 0 24 24"><path d="M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M9 21v-7h6v7"/></svg><span>今日</span></button>
  <button data-v="en"><svg class="ic" viewBox="0 0 24 24"><path d="M4 5h16M4 5v14M12 5v14"/><path d="M7 9h2M7 13h2M15 9h4M15 13h3"/></svg><span>英语</span></button>
  <button data-v="geo"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 3 2.5 15 0 18M12 3c-2.5 3-2.5 15 0 18"/></svg><span>世界</span></button>
  <button data-v="retail"><svg class="ic" viewBox="0 0 24 24"><path d="M4 8h16l-1 12H5z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg><span>零售</span></button>
</div></nav>
<script>

window.EN_SCENES = (window.EN_SCENES || []).concat([
{
  id:"supermarket", title:"超市采购", en:"At the Supermarket", tone:"最高频，几乎每周都会用到",

    {name:"水果 Fruits", items:[

      ["watermelon","西瓜"],["melon","甜瓜"],["mango","芒果"],["strawberry","草莓"],["blueberry","蓝莓"],
      ["pineapple","菠萝"],["kiwi","猕猴桃"],["pear","梨"],["peach","桃"],["lemon","柠檬"],

    {name:"主食与干货 Staples", items:[

      ["instant noodles","方便面"],["pasta","意面"],["bread","面包"],["pita bread","皮塔饼"],
      ["oats","燕麦"],["cereal","麦片"],["lentils","扁豆"],["chickpeas","鹰嘴豆"],["canned tuna","金枪鱼罐头"]
    ]},
    {name:"乳品与蛋 Dairy & Eggs", items:[
      ["milk","牛奶"],["full fat / low fat / skimmed","全脂 / 低脂 / 脱脂"],["fresh milk","鲜奶"],
      ["long life milk","常温奶"],["yoghurt","酸奶"],["laban","咸味酸奶饮品（当地特色）"],
      ["cheese","奶酪"],["cheddar","切达"],["cream cheese","奶油奶酪"],["butter","黄油"],
      ["cream","奶油"],["eggs","鸡蛋"],["a tray of eggs","一整盘蛋（当地按盘卖）"]
    ]},

<script>
"use strict";
var MEM={};
var ST={get:function(k,d){try{var v=localStorage.getItem("pf_"+k);return v?JSON.parse(v):(MEM[k]!==undefined?MEM[k]:d);}catch(e){return MEM[k]!==undefined?MEM[k]:d;}},
       set:function(k,v){MEM[k]=v;try{localStorage.setItem("pf_"+k,JSON.stringify(v));}catch(e){}}};
var EPOCH=new Date(2026,0,1);
function today(){var n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate());}
function dayIndex(){return Math.floor((today()-EPOCH)/86400000);}
function ymd(d){d=d||today();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function cnDate(){var d=today();return (d.getMonth()+1)+" 月 "+d.getDate()+" 日 · 周"+"日一二三四五六"[d.getDay()];}
var SCENES=window.EN_SCENES||[],GEOIDX=[],RETAIL=null;
function todayScene(){return SCENES[dayIndex()%SCENES.length];}
function todayCountry(){return GEOIDX.length?GEOIDX[(dayIndex()*7+3)%GEOIDX.length]:null;}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function attr(s){return esc(s).replace(/'/g,"&#39;");}
function sq(s){return String(s).replace(/\\/g,"").replace(/'/g,"\\'");}
var IC_SPK='<svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
var IC_STAR='<svg viewBox="0 0 24 24"><path d="m12 3 2.7 5.7 6.3.9-4.5 4.4 1 6.3L12 17.4 6.5 20.3l1-6.3L3 9.6l6.3-.9z"/></svg>';
var cur="today";
function go(v){cur=v;document.querySelectorAll(".view").forEach(function(s){s.classList.toggle("on",s.id==="v-"+v);});
  document.querySelectorAll("nav button").forEach(function(b){b.classList.toggle("on",b.dataset.v===v||(v==="study"&&b.dataset.v==="en"));});
  window.scrollTo(0,0);if(v==="geo")setTimeout(sizeMap,30);}
document.querySelectorAll("nav button").forEach(function(b){b.onclick=function(){go(b.dataset.v);};});
/* ---- speech ---- */
var VOICE=null;
function pickVoice(){try{var vs=speechSynthesis.getVoices()||[];
  VOICE=vs.find(function(v){return /en-GB/i.test(v.lang)})||vs.find(function(v){return /en-US/i.test(v.lang)})||vs.find(function(v){return /^en/i.test(v.lang)})||null;}catch(e){}}
if(window.speechSynthesis){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function say(t){if(!window.speechSynthesis)return;try{speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(String(t).replace(/\s*\/\s*/g," or "));u.lang="en-GB";u.rate=.88;if(VOICE)u.voice=VOICE;speechSynthesis.speak(u);}catch(e){}}
/* ---- SRS ---- */
var STEPS=[0,1,2,4,7,15,30,60];
function vocab(){return ST.get("vocab",{});}
function saveVocab(v){ST.set("vocab",v);}
function K(en){return String(en).toLowerCase().trim();}
function itemsOf(s){var a=[];s.groups.forEach(function(g){g.items.forEach(function(i){a.push({en:i[0],zh:i[1],nt:"",k:"词"});});});
  s.phrases.forEach(function(p){a.push({en:p[0],zh:p[1],nt:p[2]||"",k:"句"});});return a;}
function rec(en){return vocab()[K(en)];}
function setRec(o){var v=vocab();v[K(o.en)]=o;saveVocab(v);}
function gradeCard(it,g,sid){
  var v=vocab(),k=K(it.en),o=v[k]||{en:it.en,zh:it.zh,s:sid,lv:0,seen:0,miss:0};
  o.zh=it.zh;o.s=sid||o.s;o.seen=(o.seen||0)+1;o.last=ymd();
  if(g==="yes")o.lv=Math.min((o.lv||0)+2,STEPS.length-1);
  else if(g==="mid"){o.lv=Math.max(1,Math.min((o.lv||0)+1,3));o.miss=(o.miss||0)+1;}
  else{o.lv=0;o.miss=(o.miss||0)+2;}
  var d=new Date();d.setDate(d.getDate()+STEPS[o.lv]);o.due=ymd(d);
  v[k]=o;saveVocab(v);
}
function dueList(){var v=vocab(),t=ymd(),a=[];for(var k in v)if(!v[k].due||v[k].due<=t)a.push(v[k]);return a;}
function weakList(){var v=vocab(),a=[];for(var k in v)if((v[k].miss||0)>=2||(v[k].lv||0)<=1)a.push(v[k]);
  return a.sort(function(x,y){return (y.miss||0)-(x.miss||0);});}
function knownCount(){var v=vocab(),n=0;for(var k in v)if((v[k].lv||0)>=4)n++;return n;}
function refreshStats(){
  var log=ST.get("log",{}),t=ymd();
  var e=document.getElementById("stNew");if(e)e.textContent=(log[t]&&log[t].n)||0;
  e=document.getElementById("stDue");if(e)e.textContent=dueList().length;
  e=document.getElementById("stKnown");if(e)e.textContent=knownCount();
  e=document.getElementById("stWeak");if(e)e.textContent=weakList().length;
}
function bumpLog(n){var log=ST.get("log",{}),t=ymd();log[t]=log[t]||{n:0};log[t].n+=n;ST.set("log",log);}
/* ---- TODAY ---- */

  document.getElementById("tdSub").textContent="学一个高频英语单元，认识一个国家。";
  var all=itemsOf(s),pos=posOf(s.id);
  document.getElementById("tdScene").innerHTML=
   '<div class="card"><div class="eyebrow">Unit '+((dayIndex()%SCENES.length)+1)+' / '+SCENES.length+'</div>'+
   '<h3 style="font-size:19px">'+esc(s.title)+' <span class="muted" style="font-weight:400;font-size:14px">'+esc(s.en)+'</span></h3>'+
   '<p class="small muted" style="margin:8px 0 12px">'+esc(s.intro)+'</p>'+
   '<div class="row" style="margin-bottom:13px"><span class="chip ac">'+all.length+' 张卡片</span><span class="chip">'+s.groups.length+' 个分类</span>'+
   (pos?'<span class="chip ok">已学到第 '+pos+' 张</span>':'')+'</div>'+
   '<div class="row"><button class="btn pri" style="flex:1" onclick="startStudy(\''+attr(s.id)+'\',\'new\')">'+(pos?'继续学习':'进入学习模式')+'</button>'+
   '<button class="btn" style="flex:1" onclick="openScene(\''+attr(s.id)+'\')">查看列表</button></div>'+
   '<div class="row" style="margin-top:9px"><button class="btn full" onclick="startReview()">复习 '+dueList().length+' 张到期卡片</button></div></div>';
  if(c){document.getElementById("tdGeo").innerHTML=
   '<div style="display:flex;gap:14px;align-items:center"><div class="cflag">'+c.flag+'</div>'+
   '<div><h3 style="font-size:19px">'+esc(c.zh)+'</h3><div class="tiny">'+esc(c.en)+' · '+esc(c.cont)+' · '+esc(c.cap)+'</div></div></div>';
   document.getElementById("tdGeo").onclick=function(){showCountry(c.id);};}
  renderTodayRetail();refreshStats();
}
function renderTodayRetail(){
  var el=document.getElementById("tdRetail"),hd=document.getElementById("tdRetailHd");
  if(!RETAIL||!(RETAIL.sections||[]).length){
    el.innerHTML='<div class="card"><p class="small muted" style="margin:0">零售板块需要密码。</p>'+
      '<div class="row" style="margin-top:10px"><button class="btn full" onclick="go(\'retail\')">前往解锁</button></div></div>';return;}
  var picks=[];RETAIL.sections.forEach(function(sec){(sec.items||[]).forEach(function(i){picks.push([sec.title,i]);});});
  var st=(dayIndex()*2)%Math.max(picks.length,1);
  el.innerHTML=[picks[st],picks[(st+1)%picks.length]].filter(Boolean).map(function(p){
    return '<div class="card" style="margin-bottom:10px"><div class="eyebrow">'+esc(p[0])+'</div>'+
      '<div style="font-weight:640;font-size:15px;margin-bottom:6px">'+esc(p[1].t)+'</div>'+
      '<div class="small muted">'+esc(String(p[1].body).slice(0,110))+'…</div></div>';
  }).join("")+'<button class="btn full" onclick="go(\'retail\')">查看全部</button>';

/* ---- MAP ---- */
var M={feat:null,map:{},z:1,ox:0,oy:0,drag:false,px:0,py:0,moved:0,pinch:0,W:0,H:0,hover:null};
var cv=document.getElementById("map"),cx=cv?cv.getContext("2d"):null;
function sizeMap(){
  if(!cv)return;var w=cv.parentNode.clientWidth||360;var h=Math.round(Math.min(w*0.62,460));
  var dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=w*dpr;cv.height=h*dpr;cv.style.height=h+"px";cx.setTransform(dpr,0,0,dpr,0,0);
  M.W=w;M.H=h;drawMap();
}
function base(){return M.W/360;}
function pxOf(lon,lat){var b=base()*M.z;return [(lon+180)*b+M.ox,(84-lat)*b*(180/168)+M.oy];}
function lonlatOf(x,y){var b=base()*M.z;return [(x-M.ox)/b-180,84-(y-M.oy)/(b*(180/168))];}
function fitMap(){M.z=1;M.ox=0;M.oy=(M.H-base()*180*(168/180))/2;}
function drawMap(){
  if(!cx)return;
  cx.clearRect(0,0,M.W,M.H);
  cx.fillStyle="#dce7f2";cx.fillRect(0,0,M.W,M.H);
  if(!M.feat){cx.fillStyle="#9aa8ba";cx.font="13px sans-serif";cx.textAlign="center";
    cx.fillText("地图数据加载中…",M.W/2,M.H/2);cx.textAlign="left";return;}
  M.feat.forEach(function(f,fi){
    var known=M.map[fi];
    cx.beginPath();
    f.polys.forEach(function(ring){
      for(var i=0;i<ring.length;i++){var p=pxOf(ring[i][0],ring[i][1]);
        if(i===0)cx.moveTo(p[0],p[1]);else cx.lineTo(p[0],p[1]);}
      cx.closePath();});
    cx.fillStyle=known?(M.hover===fi?"#f0b070":"#e8d3ba"):"#eef1f4";
    cx.fill();
    cx.lineWidth=.6;cx.strokeStyle=known?"#c99a63":"#d7dde4";cx.stroke();
  });
}
function ptIn(ring,x,y){
  var inside=false;
  for(var i=0,j=ring.length-1;i<ring.length;j=i++){
    var xi=ring[i][0],yi=ring[i][1],xj=ring[j][0],yj=ring[j][1];
    if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))inside=!inside;}
  return inside;
}
function featAt(lon,lat){
  for(var i=0;i<M.feat.length;i++){
    var f=M.feat[i];
    if(lon<f.bb[0]||lon>f.bb[2]||lat<f.bb[1]||lat>f.bb[3])continue;
    for(var j=0;j<f.polys.length;j++)if(ptIn(f.polys[j],lon,lat))return i;}
  return -1;
}
function evPt(e){var r=cv.getBoundingClientRect();var t=e.touches&&e.touches[0]?e.touches[0]:e;return [t.clientX-r.left,t.clientY-r.top];}
function zoomAt(f,cxp,cyp){
  var nz=Math.max(1,Math.min(14,M.z*f));var k=nz/M.z;
  M.ox=cxp-(cxp-M.ox)*k;M.oy=cyp-(cyp-M.oy)*k;M.z=nz;clampMap();drawMap();
}
function zoomBy(f){zoomAt(f,M.W/2,M.H/2);}
function resetMap(){fitMap();drawMap();}
function clampMap(){
  var w=base()*M.z*360,h=base()*M.z*180*(168/180);
  M.ox=Math.min(0,Math.max(M.W-w,M.ox));
  if(h<=M.H)M.oy=(M.H-h)/2;else M.oy=Math.min(0,Math.max(M.H-h,M.oy));
}
if(cv){
  cv.addEventListener("mousedown",function(e){M.drag=true;M.moved=0;var p=evPt(e);M.px=p[0];M.py=p[1];});
  window.addEventListener("mousemove",function(e){
    if(!M.drag){if(cur!=="geo"||!M.feat)return;
      var p=evPt(e);if(p[0]<0||p[0]>M.W||p[1]<0||p[1]>M.H)return;
      var ll=lonlatOf(p[0],p[1]),fi=featAt(ll[0],ll[1]);
      var tip=document.getElementById("mtip");
      if(fi>=0&&M.map[fi]){M.hover=fi;tip.textContent=M.map[fi].zh;tip.classList.add("on");}
      else{M.hover=null;tip.classList.remove("on");}
      drawMap();return;}
    var p2=evPt(e);M.ox+=p2[0]-M.px;M.oy+=p2[1]-M.py;M.moved+=Math.abs(p2[0]-M.px)+Math.abs(p2[1]-M.py);
    M.px=p2[0];M.py=p2[1];clampMap();drawMap();});
  window.addEventListener("mouseup",function(e){
    if(M.drag&&M.moved<5)tapMap(e);M.drag=false;});
  cv.addEventListener("wheel",function(e){e.preventDefault();var p=evPt(e);zoomAt(e.deltaY<0?1.18:1/1.18,p[0],p[1]);},{passive:false});
  cv.addEventListener("touchstart",function(e){
    if(e.touches.length===2){M.pinch=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);M.drag=false;return;}
    M.drag=true;M.moved=0;var p=evPt(e);M.px=p[0];M.py=p[1];},{passive:true});
  cv.addEventListener("touchmove",function(e){
    if(e.touches.length===2){e.preventDefault();
      var d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
      if(M.pinch){var r=cv.getBoundingClientRect();
        zoomAt(d/M.pinch,(e.touches[0].clientX+e.touches[1].clientX)/2-r.left,(e.touches[0].clientY+e.touches[1].clientY)/2-r.top);}
      M.pinch=d;return;}
    if(!M.drag)return;e.preventDefault();var p=evPt(e);
    M.ox+=p[0]-M.px;M.oy+=p[1]-M.py;M.moved+=Math.abs(p[0]-M.px)+Math.abs(p[1]-M.py);
    M.px=p[0];M.py=p[1];clampMap();drawMap();},{passive:false});
  cv.addEventListener("touchend",function(e){
    if(M.drag&&M.moved<7&&e.changedTouches&&e.changedTouches[0])tapMap({clientX:e.changedTouches[0].clientX,clientY:e.changedTouches[0].clientY});
    M.drag=false;M.pinch=0;});
}
function tapMap(e){
  if(!M.feat)return;var p=evPt(e);var ll=lonlatOf(p[0],p[1]);var fi=featAt(ll[0],ll[1]);
  if(fi>=0&&M.map[fi])showCountry(M.map[fi].id);
  else if(fi>=0){var tip=document.getElementById("mtip");tip.textContent=(M.feat[fi].name||"这个国家")+" · 暂无资料";tip.classList.add("on");
    setTimeout(function(){tip.classList.remove("on");},1800);}
}
function decodeTopo(topo,objName){
  var o=topo.objects[objName],tr=topo.transform,arcs=topo.arcs;
  var cache=arcs.map(function(a){var x=0,y=0,out=[];
    for(var i=0;i<a.length;i++){x+=a[i][0];y+=a[i][1];
      out.push([x*tr.scale[0]+tr.translate[0],y*tr.scale[1]+tr.translate[1]]);}return out;});
  function ring(idx){var out=[];idx.forEach(function(a){var rev=a<0,ar=cache[rev?~a:a].slice();
    if(rev)ar.reverse();if(out.length)ar.shift();out=out.concat(ar);});return out;}
  var feats=[];
  (o.geometries||[]).forEach(function(g){
    var polys=[];
    if(g.type==="Polygon")g.arcs.forEach(function(r){polys.push(ring(r));});
    else if(g.type==="MultiPolygon")g.arcs.forEach(function(pp){pp.forEach(function(r){polys.push(ring(r));});});
    if(!polys.length)return;
    var bb=[180,90,-180,-90];
    polys.forEach(function(r){r.forEach(function(pt){
      if(pt[0]<bb[0])bb[0]=pt[0];if(pt[1]<bb[1])bb[1]=pt[1];
      if(pt[0]>bb[2])bb[2]=pt[0];if(pt[1]>bb[3])bb[3]=pt[1];});});
    feats.push({polys:polys,bb:bb,name:(g.properties&&g.properties.name)||"",id:g.id});
  });
  return feats;
}
function loadMap(){
  var urls=["https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json",
            "https://unpkg.com/world-atlas@2/countries-110m.json"];
  (function nx(i){
    if(i>=urls.length){drawMap();return;}
    fetch(urls[i]).then(function(r){return r.ok?r.json():Promise.reject();}).then(function(t){
      M.feat=decodeTopo(t,"countries");
      GEOIDX.forEach(function(c){
        var fi=featAt(c.lon,c.lat);
        if(fi>=0&&!M.map[fi])M.map[fi]=c;
      });
      fitMap();drawMap();
    }).catch(function(){nx(i+1);});
  })(0);
}

function wikiImg(el,title){

   .then(function(r){return r.ok?r.json():Promise.reject();}).then(function(j){
     var u=(j.thumbnail&&j.thumbnail.source)||(j.originalimage&&j.originalimage.source);
     if(u){var im=new Image();im.onload=function(){el.innerHTML="";el.appendChild(im);};im.src=u;}}).catch(function(){});

function miniMap(canvas,cid){
  var c=GEOIDX.filter(function(x){return x.id===cid;})[0];
  if(!M.feat||!canvas||!c)return;
  var fi=-1;for(var k in M.map)if(M.map[k].id===cid){fi=+k;break;}
  if(fi<0)fi=featAt(c.lon,c.lat);
  if(fi<0)return;
  var f=M.feat[fi],ctx2=canvas.getContext("2d");
  var w=canvas.parentNode.clientWidth,h=190,dpr=Math.min(window.devicePixelRatio||1,2);
  canvas.width=w*dpr;canvas.height=h*dpr;canvas.style.width="100%";canvas.style.height=h+"px";ctx2.setTransform(dpr,0,0,dpr,0,0);
  var bb=f.bb,pad=.12;
  var dw=(bb[2]-bb[0])||1,dh=(bb[3]-bb[1])||1;
  var sc=Math.min(w/(dw*(1+pad*2)),h/(dh*(1+pad*2)));
  var cxm=(bb[0]+bb[2])/2,cym=(bb[1]+bb[3])/2;
  function P(lon,lat){return [w/2+(lon-cxm)*sc,h/2-(lat-cym)*sc];}
  ctx2.fillStyle="#eef3f8";ctx2.fillRect(0,0,w,h);
  ctx2.beginPath();
  f.polys.forEach(function(r){for(var i=0;i<r.length;i++){var p=P(r[i][0],r[i][1]);if(i===0)ctx2.moveTo(p[0],p[1]);else ctx2.lineTo(p[0],p[1]);}ctx2.closePath();});
  ctx2.fillStyle="#e8d3ba";ctx2.fill();ctx2.lineWidth=1;ctx2.strokeStyle="#c08a4e";ctx2.stroke();
  var cp=P(c.lon,c.lat);
  ctx2.beginPath();ctx2.arc(cp[0],cp[1],4,0,7);ctx2.fillStyle="#cf4a2e";ctx2.fill();
  ctx2.strokeStyle="#fff";ctx2.lineWidth=1.6;ctx2.stroke();
}

}

/* ---- RETAIL (encrypted) ---- */
function b64d(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
function unlock(pw,silent){
  return fetch("data/retail.enc.json").then(function(r){return r.json();}).then(function(p){
    var enc=new TextEncoder();
    return crypto.subtle.importKey("raw",enc.encode(pw),{name:"PBKDF2"},false,["deriveKey"])
     .then(function(base){return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64d(p.salt),iterations:p.iter||150000,hash:"SHA-256"},
        base,{name:"AES-GCM",length:256},false,["decrypt"]);})
     .then(function(key){return crypto.subtle.decrypt({name:"AES-GCM",iv:b64d(p.iv)},key,b64d(p.ct));})
     .then(function(buf){RETAIL=JSON.parse(new TextDecoder().decode(buf));
       ST.set("rpw",pw);renderRetail();renderTodayRetail();return true;});
  }).catch(function(){if(!silent)alert("密码不对，或数据文件还没上传。");
    ST.set("rpw",null);return false;});
}
function renderRetail(){
  var box=document.getElementById("retailBody");if(!box)return;
  if(!RETAIL){
    box.innerHTML='<div class="card" style="text-align:center;padding:30px 18px">'+
     '<div class="eyebrow">零售动向</div><h2 style="font-size:19px;margin:6px 0 8px">这个板块需要密码</h2>'+
     '<p class="small muted" style="margin:0 0 16px">里面是玩具 / 毛绒 / 文具的品牌新品、IP 动向、展会与消费趋势，以及给采购的解读。</p>'+
     '<input class="inp" id="rpw" type="password" placeholder="输入密码" autocomplete="current-password">'+
     '<div class="row" style="margin-top:11px"><button class="btn pri full" id="rgo">解锁</button></div></div>';
    var f=function(){unlock(document.getElementById("rpw").value||"");};
    document.getElementById("rgo").onclick=f;
    document.getElementById("rpw").onkeydown=function(e){if(e.key==="Enter")f();};
    return;}
  var h='<div class="card" style="background:linear-gradient(150deg,#f4f0fb,#fff 70%);border-color:#e6dff5">'+
   '<div class="eyebrow">零售动向 · 玩具 / 毛绒 / 文具</div><h2 style="font-size:20px">本期更新</h2>'+
   '<div class="tiny" style="margin-top:6px">数据截至 '+esc(RETAIL.updated||"—")+'</div>'+
   '<p class="small muted" style="margin:10px 0 0">'+esc(RETAIL.note||"")+'</p></div>';
  (RETAIL.sections||[]).forEach(function(s){
    h+='<div class="sec-t">'+esc(s.title)+'</div>';
    if(s.lead)h+='<div class="tiny" style="margin:-4px 0 12px">'+esc(s.lead)+'</div>';
    h+='<div class="card">';
    (s.items||[]).forEach(function(it,ix){
      h+='<div class="ri"'+(ix===s.items.length-1?' style="margin-bottom:0"':'')+'>'+
       (it.tag?'<span class="chip ac" style="margin-bottom:7px">'+esc(it.tag)+'</span>':'')+
       '<h4>'+esc(it.t)+'</h4><p>'+esc(it.body)+'</p>'+
       (it.take?'<div class="take"><b>解读 · </b>'+esc(it.take)+'</div>':'')+
       (it.src?'<div class="tiny"><a href="'+attr(it.src.u)+'" target="_blank" rel="noopener">'+esc(it.src.n)+' ↗</a></div>':'')+'</div>';});
    h+='</div>';});
  if((RETAIL.archive||[]).length){h+='<div class="sec-t">往期归档</div><div class="card">'+
    RETAIL.archive.map(function(a){return '<div class="ri"><h4>'+esc(a.t)+'</h4><p>'+esc(a.body)+'</p><div class="tiny">'+esc(a.date||"")+'</div></div>';}).join("")+'</div>';}
  h+='<div style="height:24px"></div>';box.innerHTML=h;
}

function boot(){
  renderToday();curScene=todayScene().id;renderPills();openScene(curScene);go("today");
  sizeMap();window.addEventListener("resize",function(){sizeMap();});
  fetch("data/geo-index.json").then(function(r){return r.json();}).then(function(j){
    GEOIDX=j;renderGeoList();renderToday();loadMap();
  }).catch(function(){document.getElementById("geoGrid").innerHTML='<div class="empty">国家数据没能加载。如果你是直接双击本地文件打开的，请改用网址访问。</div>';});
  var pw=ST.get("rpw",null);
  if(pw)unlock(pw,true).then(function(ok){if(!ok)renderRetail();});else renderRetail();
}
boot();
